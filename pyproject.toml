[project]
name = "appium-android-portfolio"
version = "0.1.0"
description = "Appium demo app practice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "appium-python-client>=4.4",
    "selenium>=4.21",
]

[dependency-groups]
  dev = [
      "pytest>=8.3",
      "allure-pytest>=2.13",
      "pydantic-settings>=2.3",
      "pytest-xdist>=3.6",
      "ruff>=0.4",
      "mypy>=1.10",
      "pre-commit>=3.7",
  ]

[tool.pytest.ini_options]
  testpaths = ["tests"]
  addopts = "-v --tb=short --alluredir=allure-results --clean-alluredir"
  markers = [
      "smoke: core happy-path tests",
      "regression: extended coverage tests",
  ]

[tool.ruff]
  line-length = 100
  target-version = "py312"

[tool.ruff.lint]
    select = ["E", "F", "I", "UP", "B", "SIM"]
    ignore = []

[tool.ruff.lint.per-file-ignores]
    "tests/**" = ["S101"]  # allow assert statements in tests


[tool.mypy]
  python_version = "3.12"
  warn_return_any = true
  warn_unused_configs = true
  ignore_missing_imports = true
